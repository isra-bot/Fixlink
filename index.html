<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FixLink Cameroon</title>
<meta name="theme-color" content="#1F4D3D">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1F4D3D;
  --green-2:#173C30;
  --ochre:#E4A324;
  --ochre-2:#C88A16;
  --ink:#17181A;
  --paper:#F6F3EC;
  --card:#FFFFFF;
  --line:rgba(23,24,26,0.12);
  --muted:#6B6F6C;
  --clay:#C0533A;
  --success:#2F7A4D;
  --radius:16px;
  --radius-sm:10px;
  color-scheme: light;
}
[data-theme="dark"]{
  --green:#3E7C63;
  --ochre:#F0B23C;
  --ink:#F3F1E9;
  --paper:#0F1713;
  --card:#182420;
  --line:rgba(243,241,233,0.12);
  --muted:#9BA39D;
  color-scheme: dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family:'Manrope',system-ui,sans-serif;
  background:#0F1713;
  color:var(--ink);
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
}
.mono{font-family:'JetBrains Mono',monospace;}
#shell{
  width:100%;
  max-width:430px;
  min-height:100vh;
  background:var(--paper);
  position:relative;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}
@media (min-width:460px){
  body{padding:28px 12px;}
  #shell{min-height:844px; height:844px; border-radius:34px; box-shadow:0 30px 60px rgba(0,0,0,0.5); border:6px solid #05100b; overflow:hidden;}
  #scroll{overflow-y:auto;}
}
#topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px 10px; flex-shrink:0;
}
#logo{display:flex; align-items:center; gap:8px; font-weight:800; font-size:18px; letter-spacing:-0.02em; color:var(--green);}
[data-theme="dark"] #logo{color:var(--ochre);}
#logo .dot{width:9px;height:9px;border-radius:50%;background:var(--ochre);}
#topctrls{display:flex; gap:6px;}
.pill-btn{
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:20px; padding:6px 10px; font-size:12px; font-weight:700;
  cursor:pointer; font-family:inherit;
}
#scroll{flex:1; overflow-y:auto; padding-bottom:86px;}
.screen{padding:4px 18px 28px;}
h1.page-title{font-size:24px; font-weight:800; letter-spacing:-0.02em; margin:6px 0 4px;}
p.page-sub{color:var(--muted); font-size:14px; margin:0 0 18px; line-height:1.5;}
.search-wrap{position:relative; margin-bottom:18px;}
.search-wrap input{
  width:100%; padding:14px 16px 14px 42px; border-radius:var(--radius-sm);
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  font-family:inherit; font-size:14px; font-weight:600;
}
.search-wrap svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:0.5;}
.cat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:22px;}
.cat-tile{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:12px 6px; text-align:center; cursor:pointer; transition:transform .12s;
}
.cat-tile:active{transform:scale(0.94);}
.cat-tile .ic{font-size:22px; display:block; margin-bottom:5px;}
.cat-tile .lb{font-size:10.5px; font-weight:700; line-height:1.2; color:var(--ink);}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin:22px 0 12px;}
.section-head h2{font-size:16px; font-weight:800; margin:0; letter-spacing:-0.01em;}
.section-head a{font-size:12px; color:var(--green); font-weight:700; text-decoration:none;}
[data-theme="dark"] .section-head a{color:var(--ochre);}

.pro-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; margin-bottom:12px; display:flex; gap:12px; cursor:pointer;
}
.avatar{
  width:54px;height:54px;border-radius:14px; flex-shrink:0;
  display:flex;align-items:center;justify-content:center; font-weight:800; font-size:17px; color:#fff;
}
.pro-body{flex:1; min-width:0;}
.pro-top{display:flex; align-items:flex-start; justify-content:space-between; gap:6px;}
.pro-name{font-weight:800; font-size:14.5px; margin:0;}
.badge{
  display:inline-flex; align-items:center; gap:3px; font-size:10px; font-weight:800;
  padding:2px 6px; border-radius:6px; background:rgba(47,122,77,0.12); color:var(--success); flex-shrink:0;
}
.badge.na{background:rgba(107,111,108,0.15); color:var(--muted);}
.pro-cat{color:var(--muted); font-size:12.5px; margin:2px 0 6px;}
.pro-meta{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); flex-wrap:wrap;}
.pro-meta .star{color:var(--ochre-2); font-weight:800;}
[data-theme="dark"] .pro-meta .star{color:var(--ochre);}
.price-tag{margin-top:8px; font-size:12.5px; font-weight:700; color:var(--green);}
[data-theme="dark"] .price-tag{color:var(--ochre);}
.avail-dot{width:7px;height:7px;border-radius:50%; background:var(--success); display:inline-block; margin-right:4px;}

.filters-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px;}
.chip{
  flex-shrink:0; padding:8px 13px; border-radius:20px; border:1px solid var(--line);
  background:var(--card); font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap;
}
.chip.active{background:var(--green); color:#fff; border-color:var(--green);}

.bottom-nav{
  position:absolute; left:0; right:0; bottom:0;
  background:var(--card); border-top:1px solid var(--line);
  display:flex; padding:8px 6px 12px; gap:2px; z-index:20;
}
.nav-item{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 2px; border-radius:10px; cursor:pointer; color:var(--muted); background:none; border:none; font-family:inherit;
}
.nav-item.active{color:var(--green);}
[data-theme="dark"] .nav-item.active{color:var(--ochre);}
.nav-item .ic{font-size:19px;}
.nav-item .lb{font-size:9.5px; font-weight:700;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:14px 18px; border-radius:var(--radius-sm); font-weight:800; font-size:14px;
  border:none; cursor:pointer; font-family:inherit; width:100%;
}
.btn-primary{background:var(--ochre); color:#241A03;}
.btn-primary:active{background:var(--ochre-2);}
.btn-outline{background:transparent; border:1.5px solid var(--line); color:var(--ink);}
.btn-green{background:var(--green); color:#fff;}
.btn-sm{padding:9px 14px; font-size:12.5px; width:auto;}
.btn-row{display:flex; gap:8px; margin-top:10px;}
.btn-row .btn{flex:1;}
.btn:disabled{opacity:0.45; cursor:not-allowed;}

.back-row{display:flex; align-items:center; gap:10px; padding:12px 18px 0; flex-shrink:0;}
.back-btn{
  width:34px;height:34px;border-radius:10px; background:var(--card); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
}
.hero{
  background:linear-gradient(155deg, var(--green) 0%, var(--green-2) 100%);
  border-radius:20px; padding:22px 20px; margin:6px 0 20px; color:#fff; position:relative; overflow:hidden;
}
.hero::after{content:"";position:absolute; right:-30px; top:-30px; width:130px; height:130px; border-radius:50%; background:rgba(228,163,36,0.18);}
.hero h1{font-size:21px; font-weight:800; margin:0 0 4px; letter-spacing:-0.02em; position:relative;}
.hero p{font-size:12.5px; opacity:0.85; margin:0; position:relative;}

.profile-hero{padding:20px 0 10px; text-align:center;}
.profile-hero .avatar{width:76px;height:76px;border-radius:22px;font-size:26px;margin:0 auto 10px;}
.profile-hero h2{margin:0; font-size:19px; font-weight:800;}
.profile-hero .cat{color:var(--muted); font-size:13px; margin:2px 0 10px;}
.stat-row{display:flex; justify-content:center; gap:22px; margin:14px 0;}
.stat-row div{text-align:center;}
.stat-row .n{font-size:17px; font-weight:800;}
.stat-row .l{font-size:10.5px; color:var(--muted); font-weight:700;}
.contact-row{display:flex; gap:8px; margin:14px 0;}
.contact-row .btn{padding:11px 8px; font-size:12px;}

.info-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px;}
.info-card h3{font-size:12.5px; text-transform:none; font-weight:800; margin:0 0 8px; color:var(--muted);}
.info-card p{margin:0; font-size:13.5px; line-height:1.55;}
.service-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
.service-row:last-child{border-bottom:none;}
.service-row .p{font-weight:800; color:var(--green);}
[data-theme="dark"] .service-row .p{color:var(--ochre);}
.review{padding:10px 0; border-bottom:1px solid var(--line);}
.review:last-child{border-bottom:none;}
.review .h{display:flex; justify-content:space-between; font-size:12.5px; font-weight:700;}
.review p{margin:4px 0 0; font-size:12.5px; color:var(--muted); line-height:1.5;}

form.field-set{display:flex; flex-direction:column; gap:14px;}
.field label{display:block; font-size:12px; font-weight:800; margin-bottom:6px; color:var(--muted);}
.field input, .field select, .field textarea{
  width:100%; padding:12px 13px; border-radius:var(--radius-sm); border:1px solid var(--line);
  background:var(--card); color:var(--ink); font-family:inherit; font-size:13.5px; font-weight:600;
}
.field textarea{resize:vertical; min-height:74px;}
.photo-add{
  width:64px;height:64px;border-radius:12px;border:1.5px dashed var(--line); display:flex; align-items:center;
  justify-content:center; font-size:20px; color:var(--muted); cursor:pointer; flex-shrink:0; background:var(--card);
}

.status-track{display:flex; flex-direction:column; gap:0; margin:14px 0 4px;}
.status-step{display:flex; gap:12px; position:relative;}
.status-step .line{width:2px; background:var(--line); position:absolute; left:9px; top:22px; bottom:-6px;}
.status-step:last-child .line{display:none;}
.status-dot{width:20px;height:20px;border-radius:50%; border:2px solid var(--line); background:var(--card); flex-shrink:0; z-index:1;}
.status-step.done .status-dot{background:var(--success); border-color:var(--success);}
.status-step.current .status-dot{background:var(--ochre); border-color:var(--ochre);}
.status-txt{padding-bottom:22px;}
.status-txt .t{font-size:13.5px; font-weight:800;}
.status-txt .d{font-size:11.5px; color:var(--muted);}

.booking-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px; cursor:pointer;}
.booking-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.booking-top h4{margin:0; font-size:14px; font-weight:800;}
.status-chip{font-size:10px; font-weight:800; padding:3px 8px; border-radius:7px; white-space:nowrap;}
.sc-Requested{background:rgba(228,163,36,0.18); color:var(--ochre-2);}
.sc-QuoteSent{background:rgba(30,110,220,0.14); color:#2864C7;}
.sc-Accepted, .sc-Scheduled{background:rgba(47,122,77,0.14); color:var(--success);}
.sc-Completed{background:rgba(47,122,77,0.22); color:var(--success);}
.sc-Cancelled, .sc-Disputed{background:rgba(192,83,58,0.16); color:var(--clay);}
.booking-meta{font-size:12px; color:var(--muted); margin-top:6px;}

.empty-state{text-align:center; padding:50px 20px;}
.empty-state .ic{font-size:38px; margin-bottom:10px;}
.empty-state h3{font-size:15px; margin:0 0 6px;}
.empty-state p{font-size:13px; color:var(--muted); margin:0 0 16px; line-height:1.5;}

.chat-list-item{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer;}
.chat-list-item .txt{flex:1; min-width:0;}
.chat-list-item .nm{font-weight:800; font-size:13.5px;}
.chat-list-item .msg{font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.chat-list-item .tm{font-size:10.5px; color:var(--muted);}

.chat-screen{display:flex; flex-direction:column; height:100%;}
.chat-msgs{flex:1; overflow-y:auto; padding:14px 18px; display:flex; flex-direction:column; gap:8px;}
.bubble{max-width:76%; padding:10px 13px; border-radius:14px; font-size:13px; line-height:1.4;}
.bubble.me{align-self:flex-end; background:var(--green); color:#fff; border-bottom-right-radius:4px;}
.bubble.them{align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px;}
.chat-input-row{display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--line); background:var(--card);}
.chat-input-row input{flex:1; border:1px solid var(--line); border-radius:20px; padding:10px 15px; font-family:inherit; background:var(--paper); color:var(--ink);}
.send-btn{width:40px;height:40px;border-radius:50%; background:var(--ochre); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}

.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;}
.stat-box{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px;}
.stat-box .n{font-size:21px; font-weight:800;}
.stat-box .l{font-size:11px; color:var(--muted); font-weight:700; margin-top:2px;}
.qa-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px;}
.qa-btn{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px 10px; text-align:center; cursor:pointer; font-weight:700; font-size:12.5px;}
.qa-btn .ic{font-size:18px; display:block; margin-bottom:5px;}

.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line);}
.toggle-row:last-child{border-bottom:none;}
.toggle-row .lbl{font-size:13.5px; font-weight:700;}
.toggle-row .sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
.switch{width:42px;height:24px; border-radius:14px; background:var(--line); position:relative; cursor:pointer; flex-shrink:0;}
.switch.on{background:var(--success);}
.switch .knob{width:18px;height:18px;border-radius:50%; background:#fff; position:absolute; top:3px; left:3px; transition:left .15s;}
.switch.on .knob{left:21px;}

.role-switch{display:flex; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:3px; margin:0 18px 8px;}
.role-switch button{flex:1; border:none; background:none; padding:8px 4px; border-radius:16px; font-family:inherit; font-weight:800; font-size:11px; color:var(--muted); cursor:pointer;}
.role-switch button.active{background:var(--green); color:#fff;}

.toast{
  position:absolute; bottom:96px; left:18px; right:18px; background:var(--ink); color:var(--paper);
  padding:12px 16px; border-radius:12px; font-size:13px; font-weight:700; text-align:center;
  z-index:50; opacity:0; transform:translateY(8px); transition:all .25s; pointer-events:none;
}
.toast.show{opacity:1; transform:translateY(0);}
[data-theme="dark"] .toast{background:var(--card); border:1px solid var(--line);}

.verify-row{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px; margin-bottom:10px;}
.verify-row .info{flex:1;}
.verify-row .info .n{font-weight:800; font-size:13.5px;}
.verify-row .info .s{font-size:11.5px; color:var(--muted);}
</style>
</head>
<body>
<div id="shell">
  <div id="topbar">
    <div id="logo"><span class="dot"></span>FixLink</div>
    <div id="topctrls">
      <button class="pill-btn" onclick="toggleLang()" id="langBtn">FR</button>
      <button class="pill-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </div>
  </div>
  <div class="role-switch" id="roleSwitch"></div>
  <div id="scroll">
    <div id="backRow" class="back-row" style="display:none"></div>
    <div class="screen" id="app"><p style="text-align:center;margin-top:60px;color:var(--muted)">Chargement…</p></div>
  </div>
  <div class="bottom-nav" id="bottomNav"></div>
  <div class="toast" id="toast"></div>
</div>

}
function saveLS(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

function persistAll(){
  saveLS('fx_favorites', favorites);
  saveLS('fx_proprofile', proProfile);
  saveLS('fx_lang', state.lang); saveLS('fx_theme', state.theme); saveLS('fx_role', state.role);
}
function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s==null ? '' : String(s); return d.innerHTML;
}

function nav(screen, push=true){
  if(push) state.history.push({screen: state.screen, sub: state.role==='customer'?null:(state.role==='professional'?state.proScreen:state.adminScreen)});
  state.screen = screen;
  render();
  document.getElementById('scroll').scrollTop = 0;
}
function goBack(){
  const prev = state.history.pop();
  if(prev){ state.screen = prev.screen; }
  else { state.screen = 'home'; }

}
function toggleLang(){ state.lang = state.lang==='fr'?'en':'fr'; document.documentElement.lang = state.lang; persistAll(); render(); }

function setRole(r){ state.role = r; state.screen='home'; state.history=[]; persistAll(); render(); }

  const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');

function toggleAuthMode(){ state.authMode = state.authMode==='login' ? 'signup' : 'login'; state.authError=''; render(); }
function setAuthRole(r){ state.authRole = r; render(); }
async function submitAuth(e){
  e.preventDefault();
  state.authError = '';
  const email = document.getElementById('auth_email').value.trim();
  const password = document.getElementById('auth_password').value;
  const btn = document.getElementById('authSubmitBtn');
  btn.disabled = true;
  btn.textContent = state.lang==='fr' ? 'Patientez...' : 'Please wait...';
  try{
    if(state.authMode === 'signup'){
      const name = document.getElementById('auth_name').value.trim();
      const phone = document.getElementById('auth_phone').value.trim();
      const city = document.getElementById('auth_city').value;
      const role = state.authRole === 'professional' ? 'professional' : 'customer';
      const cred = await window.fb.createUserWithEmailAndPassword(window.fb.auth, email, password);
      await window.fb.setDoc(window.fb.doc(window.fb.db, 'users', cred.user.uid), {
        name, phone, city, email, role, createdAt: window.fb.serverTimestamp()
      });
      if(role === 'professional'){
        const cat = document.getElementById('auth_cat').value;
        const years = +document.getElementById('auth_years').value || 0;
        await window.fb.setDoc(window.fb.doc(window.fb.db, 'professionals', cred.user.uid), {
          name, cat, city, area:'', phone,
          years, rating:0, reviews:0, jobs:0,
          verified:false, availableNow:false, emergency:false,
          priceType:'quote', price:0,
          desc:{fr:'', en:''}, services:[],
          createdAt: window.fb.serverTimestamp()
        });
      }
      state.currentUser = { uid: cred.user.uid, email, name, phone, city, role };
      startFirestoreSync();
      render();
    } else {
      await window.fb.signInWithEmailAndPassword(window.fb.auth, email, password);
    }
  }catch(err){
    state.authError = authErrorMessage(err.code);
    render();
  }
}
function authErrorMessage(code){
  const fr = {
    'auth/email-already-in-use': 'Cet e-mail est déjà utilisé. Essayez de vous connecter.',
    'auth/invalid-email': "Cette adresse e-mail n'est pas valide.",
    'auth/weak-password': 'Le mot de passe doit contenir au moins 6 caractères.',
    'auth/wrong-password': 'Mot de passe incorrect.',
    'auth/invalid-credential': 'E-mail ou mot de passe incorrect.',
    'auth/user-not-found': 'Aucun compte ne correspond à cet e-mail.',
    'auth/too-many-requests': 'Trop de tentatives. Réessayez dans un instant.',
    'auth/network-request-failed': 'Problème de connexion internet. Réessayez.',
  };
  const en = {
    'auth/email-already-in-use': 'That email is already in use. Try logging in instead.',
    'auth/invalid-email': 'That email address looks invalid.',
    'auth/weak-password': 'Password must be at least 6 characters.',
    'auth/wrong-password': 'Incorrect password.',
    'auth/invalid-credential': 'Incorrect email or password.',
    'auth/user-not-found': 'No account found with that email.',
    'auth/too-many-requests': 'Too many attempts. Try again shortly.',
    'auth/network-request-failed': 'Internet connection problem. Please try again.',
  };
  const map = state.lang==='fr' ? fr : en;
  return map[code] || (state.lang==='fr' ? "Une erreur est survenue. Réessayez." : 'Something went wrong. Please try again.');
}
async function logout(){
  try{ await window.fb.signOut(window.fb.auth); }catch(e){}
}

/* ===================== RENDER: SHELL ===================== */
function render(){
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('themeBtn').textContent = state.theme==='light' ? '🌙' : '☀️';
  document.getElementById('langBtn').textContent = state.lang==='fr' ? 'FR' : 'EN';

  if(!state.currentUser){
    document.getElementById('roleSwitch').style.display = 'none';
    document.getElementById('roleSwitch').innerHTML = '';
    document.getElementById('bottomNav').innerHTML = '';
    document.getElementById('backRow').style.display = 'none';
    document.getElementById('app').innerHTML = renderAuth();
    return;
  }
  document.getElementById('roleSwitch').style.display = 'flex';

  // role switch
  const roles = [['customer', state.lang==='fr'?'Client':'Customer'], ['professional', state.lang==='fr'?'Pro':'Pro'], ['admin','Admin']];
  document.getElementById('roleSwitch').innerHTML = roles.map(([id,lb])=>
    `<button class="${state.role===id?'active':''}" onclick="setRole('${id}')">${lb}</button>`).join('');

  renderBottomNav();
  renderBack();

  const app = document.getElementById('app');
  if(state.role==='customer') app.innerHTML = renderCustomer();
  else if(state.role==='professional') app.innerHTML = renderProfessional();
  else app.innerHTML = renderAdmin();
}

function renderBack(){
  const showBack = ['proDetail','requestForm','bookingDetail','chatScreen','favorites'].includes(state.screen);
  const row = document.getElementById('backRow');
  if(showBack){
    row.style.display='flex';
    row.innerHTML = `<div class="back-btn" onclick="goBack()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
    </div>`;
  } else { row.style.display='none'; row.innerHTML=''; }
}

function renderBottomNav(){
  const nav = document.getElementById('bottomNav');
  let items = [];
  if(state.role==='customer'){
    items = [
      ['home','🏠',t('home')], ['searchScreen','🔍',t('search')], ['bookingsScreen','📋',t('bookings')],
      ['messagesScreen','💬',t('messages')], ['profileScreen','👤',t('profile')]
    ];
  } else if(state.role==='professional'){
    items = [
      ['pd_dashboard','📊',t('dashboard')], ['pd_requests','📥',t('requests')], ['pd_jobs','🧰',t('jobs')],
      ['pd_messages','💬',t('messages')], ['pd_profile','👤',t('profile')]
    ];
  } else {
    items = [
      ['ad_overview','📈',t('adminOverview')], ['ad_verify','✅',t('verified')], ['ad_reports','🚩',t('reports')]
    ];
  }
  nav.innerHTML = items.map(([id,ic,lb])=>{
    const active = (state.role==='customer' && state.screen===id) ||
                   (state.role==='professional' && state.proScreen===id) ||
                   (state.role==='admin' && state.adminScreen===id);
    return `<button class="nav-item ${active?'active':''}" onclick="${navFnFor(id)}">
      <span class="ic">${ic}</span><span class="lb">${lb}</span></button>`;
  }).join('');
}
function navFnFor(id){
  if(id.startsWith('pd_')) return `proNav('${id}')`;
  if(id.startsWith('ad_')) return `adminNav('${id}')`;
  return `customerNav('${id}')`;
}

async function submitRequest(e){

    landmark: document.getElementById('rf_landmark').value,
    budget: document.getElementById('rf_budget').value,
    status: 'Requested',
    quote: null,
    createdAt: window.fb.serverTimestamp(),
    reviewed: false,
  };
  try{

  let steps = '';
  if(!isTerminal){
    steps = STATUS_FLOW.map((s,i)=>{
      const cls = i < idx ? 'done' : (i===idx ? 'current' : '');
      return `<div class="status-step ${cls}"><div class="line"></div><div class="status-dot"></div>
        <div class="status-txt"><div class="t">${statusLabel(s)}</div></div></div>`;

  let quoteBlock = '';

    quoteBlock = `<div class="info-card">
      <h3>${state.lang==='fr'?'Devis reçu':'Quote received'}</h3>
      <div class="service-row"><span>${t('labour')}</span><span>${fmtMoney(r.quote.labour)}</span></div>

        <button class="btn btn-outline btn-sm" onclick="rejectQuote('${r.id}')">${t('rejectQuote')}</button>
      </div>
    </div>`;
  }

  let actionBlock = '';
  if(r.status==='Completed' && !r.reviewed){
    actionBlock = `<div class="info-card"><h3>${t('confirmDialog')}</h3>
      <div class="btn-row"><button class="btn btn-primary btn-sm" onclick="openReview('${r.id}')">${t('yesConfirm')}</button>

    actionBlock = `<p class="page-sub" style="margin-top:14px">${state.lang==='fr' ? 'En attente de mise à jour du professionnel…' : "Waiting for the professional's next update…"}</p>`;

  return `
    <h1 class="page-title">${p.name}</h1>
    <p class="page-sub">${r.service} · ${r.neighborhood || p.area || ''}, ${p.city}</p>
    ${isTerminal ? `<div class="info-card"><span class="status-chip sc-${r.status}">${statusLabel(r.status)}</span></div>` : `<div class="status-track">${steps}</div>`}
    ${quoteBlock}
    <div class="info-card">
      <h3>${t('describeProblem')}</h3><p>${escapeHtml(r.desc)}</p>
    </div>
    ${actionBlock}
    <div class="contact-row" style="margin-top:14px">
      <button class="btn btn-outline" onclick="openChat('${p.id}')">💬 ${t('message')}</button>
      <button class="btn btn-outline" onclick="callPro('${p.id}')">📞 ${t('call')}</button>
      <button class="btn btn-outline" onclick="whatsappPro('${p.id}')">🟢 WhatsApp</button>

/* Chat */
function ensureChatSync(proId){
  if(unsubChat) unsubChat();
  if(!chats[proId]) chats[proId] = [];
  const q = window.fb.query(window.fb.collection(window.fb.db,'chats',proId,'messages'), window.fb.orderBy('createdAt'));
  unsubChat = window.fb.onSnapshot(q, (snap)=>{
    chats[proId] = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(state.activeChatId===proId && (state.screen==='chatScreen' || state.proScreen==='pd_messages_chat')){
      const c = document.getElementById('chatMsgs');
      if(c){ c.innerHTML = renderChatBubbles(chats[proId]); c.scrollTop = c.scrollHeight; }
    }
    if((state.role==='customer' && state.screen==='messagesScreen') || (state.role==='professional' && state.proScreen==='pd_messages')){
      render();
    }
  }, (err)=>{ console.error(err); });
}
function renderChatBubbles(msgs){
  const mySide = state.role==='professional' ? 'pro' : 'customer';
  if(!msgs.length){
    return `<div class="bubble them">${state.lang==='fr' ? 'Bonjour, comment puis-je vous aider ?' : 'Hello, how can I help you?'}</div>`;
  }
  return msgs.map(m=>`<div class="bubble ${m.sender===mySide?'me':'them'}">${escapeHtml(m.text)}</div>`).join('');
}
function openChat(proId){ state.activeChatId = proId; ensureChatSync(proId); nav('chatScreen'); }
function messagesList(){
  const ids = Object.keys(chats).filter(id=>chats[id] && chats[id].length);

  return `<h1 class="page-title">${t('messages')}</h1>
    ${ids.map(id=>{
      const p = getPro(id); const msgs = chats[id]; const last = msgs[msgs.length-1];

      </div>`;

function chatScreen(){

function proBookingCard(r){

}
function proRequests(){

    <div class="empty-state"><div class="ic">📥</div><h3>${t('noRequests')}</h3></div>`;
  return `<h1 class="page-title">${t('requests')}</h1>

function openProBooking(id){
  const r = requests.find(x=>x.id===id);
  const app = document.getElementById('app');
  let quoteForm = '';
  if(r.status==='Requested'){
    quoteForm = `<div class="info-card">
      <h3>${t('sendQuote')}</h3>
      <div class="field-set">
        <div class="field"><label>${t('labour')}</label><input type="number" id="q_labour" value="6000"></div>
        <div class="field"><label>${t('materials')}</label><input type="number" id="q_materials" value="3000"></div>
        <div class="field"><label>${t('transport')}</label><input type="number" id="q_transport" value="1000"></div>
      </div>
      <button class="btn btn-primary" style="margin-top:10px" onclick="proSendQuote('${r.id}')">${t('sendQuote')}</button>
    </div>`;
  } else if(['Accepted','Scheduled','OnTheWay'].includes(r.status)){
    const order = ['Accepted','Scheduled','OnTheWay','Started'];
    const idx = order.indexOf(r.status);
    const next = order[idx+1] || 'Started';
    quoteForm = `<button class="btn btn-green" onclick="proAdvance('${r.id}','${next}')">${state.lang==='fr'?'Statut suivant: ':'Next status: '}${statusLabel(next)}</button>`;
  } else if(r.status==='Started'){
    quoteForm = `<button class="btn btn-primary" onclick="proMarkComplete('${r.id}')">${t('markComplete')}</button>`;
  }
  app.innerHTML = `
    <h1 class="page-title">${escapeHtml(r.customerName)}</h1>
    <p class="page-sub">${r.service}</p>
    <span class="status-chip sc-${r.status}">${statusLabel(r.status)}</span>
    <div class="info-card" style="margin-top:14px">
      <h3>${t('describeProblem')}</h3><p>${escapeHtml(r.desc)}</p>
      <p style="margin-top:8px; font-size:12px; color:var(--muted)">📍 ${escapeHtml(r.neighborhood)} ${r.landmark ? '· '+escapeHtml(r.landmark) : ''}</p>
    </div>
    ${quoteForm}
  `;
  state.screen='__proBookingTemp';
}
async function proSendQuote(id){
  const labour = +document.getElementById('q_labour').value||0;
  const materials = +document.getElementById('q_materials').value||0;
  const transport = +document.getElementById('q_transport').value||0;
  const quote = {labour, materials, transport, total: labour+materials+transport, duration:'1-2h'};
  if(await updateDocSafe(id, {quote, status:'QuoteSent'})){
    showToast(t('quoteSent'));
    proNav('pd_requests');
  }
}
async function proAdvance(id, next){
  if(await updateDocSafe(id, {status: next})) proNav('pd_jobs');
}
async function proMarkComplete(id){
  if(await updateDocSafe(id, {status:'Completed'})){
    showToast(t('jobCompleted'));
    proNav('pd_jobs');
  }
}

async function updateMyProDoc(data){
  try{
    await window.fb.updateDoc(window.fb.doc(window.fb.db,'professionals',state.currentUser.uid), data);

    showToast(state.lang==='fr' ? 'Échec — vérifiez votre connexion.' : 'Failed — check your connection.');
  }
}
function toggleAvail(){
  if(isRealPro()){
    const me = dbPros.find(p=>p.id===state.currentUser.uid) || {};
    updateMyProDoc({availableNow: !me.availableNow});
    return;
  }
  proProfile.availStatus = proProfile.availStatus==='available'?'busy':'available'; persistAll(); render();
}
function toggleEmergency(){
  if(isRealPro()){
    const me = dbPros.find(p=>p.id===state.currentUser.uid) || {};
    updateMyProDoc({emergency: !me.emergency});
    return;
  }
  proProfile.emergency = !proProfile.emergency; persistAll(); render();
}
function addService(){
  const name = prompt(state.lang==='fr' ? 'Nom du service :' : 'Service name:');
  if(!name) return;
  const price = prompt(state.lang==='fr' ? 'Prix (ex: À partir de 5,000 FCFA) :' : 'Price (e.g. From 5,000 FCFA):');
  const newService = {name:{fr:name,en:name}, price: price||'—', priceEn: price||'—'};
  if(isRealPro()){
    const me = dbPros.find(p=>p.id===state.currentUser.uid) || {};
    const services = [...(me.services||[]), newService];
    updateMyProDoc({services});
    return;
  }
  proProfile.services.push(newService);
  persistAll(); render();
}

async function approveVerify(id){
  if(dbPros.find(p=>p.id===id)){
    try{ await window.fb.updateDoc(window.fb.doc(window.fb.db,'professionals',id), {verified:true}); }
    catch(err){ showToast(state.lang==='fr'?'Échec — vérifiez votre connexion.':'Failed — check your connection.'); return; }
  } else {
    const p = getPro(id); if(p) p.verified = true;
  }
  showToast(state.lang==='fr'?'Professionnel vérifié !':'Professional verified!'); render();
}
function adminReports(){

      <div class="booking-meta">${escapeHtml(r.service)} · ${escapeHtml(r.customerName)}</div></div>`;
    }).join('')}`;
}

/* ===================== FIRESTORE SYNC ===================== */
function startFirestoreSync(){
  if(unsubRequests) unsubRequests();
  const q = window.fb.query(window.fb.collection(window.fb.db,'requests'), window.fb.orderBy('createdAt','desc'));
  unsubRequests = window.fb.onSnapshot(q, (snap)=>{
    requests = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, (err)=>{ console.error(err); });

  if(unsubPros) unsubPros();
  unsubPros = window.fb.onSnapshot(window.fb.collection(window.fb.db,'professionals'), (snap)=>{
    dbPros = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, (err)=>{ console.error(err); });
}

/* ===================== INIT ===================== */
document.documentElement.setAttribute('data-theme', state.theme);
document.documentElement.lang = state.lang;

window.onFirebaseAuthChange = async function(user){
  if(!user){
    state.currentUser = null;
    if(unsubRequests){ unsubRequests(); unsubRequests = null; }
    if(unsubChat){ unsubChat(); unsubChat = null; }
    if(unsubPros){ unsubPros(); unsubPros = null; }
    requests = []; chats = {}; dbPros = [];
    render();
    return;
  }
  try{
    const snap = await window.fb.getDoc(window.fb.doc(window.fb.db,'users',user.uid));
    if(snap.exists()){
      state.currentUser = { uid: user.uid, email: user.email, ...snap.data() };
    } else if(!state.currentUser || state.currentUser.uid !== user.uid){
      state.currentUser = { uid: user.uid, email: user.email, name: (user.email||'').split('@')[0], phone:'', city:'' };
    }
  }catch(e){
    if(!state.currentUser) state.currentUser = { uid: user.uid, email: user.email, name: (user.email||'').split('@')[0], phone:'', city:'' };
  }
  startFirestoreSync();
  render();
};

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
